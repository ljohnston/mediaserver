# ssh -i ~/.ssh/id_ed25519 -J ocid1.bastionsession.oc1.phx.amaaaaaaucmg5yaaruf5gl7avlhswure5zk2xmgs7crosxcngxg6uska3dja@host.bastion.us-phoenix-1.oci.oraclecloud.com -R 10000:localhost:22 ubuntu@10.0.1.186
